services:
  rsdw-dedicated:
    image: ghcr.io/runescape/rsdw-dedicated
    restart: unless-stopped
    ports:
      # Game port. Host and container ports must match.
      - "7777:7777/udp"
      # Beacon is RSDW_PORT + 1111.
      - "8888:8888/udp"
    environment:
      RSDW_OWNER_ID: "<userid_from_gameclient>"
      RSDW_SERVER_NAME: "rsdw-container"
      RSDW_WORLD_NAME: "MyWorld"
      # Empty string: no join password. Do not delete this line.
      # The image default is "random", which changes on every start.
      RSDW_PASSWORD: ""
      RSDW_ADMIN_PASSWORD: "<admin_password>"
      RSDW_PORT: "7777"
    volumes:
      - rsdw-dedicated:/home/steam/rsdw-dedicated

volumes:
  rsdw-dedicated:
